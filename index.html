<!DOCTYPE html>
<html>
<head>
    <title>Duka Langu la Pi</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="pi-sdk.js"></script>
    <style>
        body { text-align: center; padding: 50px; font-family: Arial; background: #f5f5f5; }
        .box { background: white; padding: 30px; border-radius: 15px; max-width: 400px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        button { padding: 15px 30px; background: #6f2dbd; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #4a1c7a; }
        #status { margin-top: 15px; color: #6f2dbd; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Karibu Duka Langu</h2>
        <p><b>Bidhaa: 1 Pi</b></p>
        <button onclick="lipaKwaPi()">LIPA KWA PI</button>
        <p id="status"></p>
    </div>

    <script>
        async function lipaKwaPi() {
            document.getElementById("status").innerText = "Inaunganisha na Pi Wallet...";
            try {
                const scopes = ['username', 'payments'];
                const auth = await Pi.authenticate(scopes);
                
                const paymentData = {
                    amount: 1,
                    memo: "Ununuzi wa bidhaa",
                    metadata: { bidhaa: "Mfano" }
                };

                const payment = await Pi.createPayment(paymentData);
                document.getElementById("status").innerText = "Kamilisha malipo kwenye Pi Wallet";

            } catch (error) {
                document.getElementById("status").innerText = "Error: " + error;
            }
        }
    </script>
</body>
</html>
