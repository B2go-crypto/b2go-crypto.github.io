<!DOCTYPE html>
<html>
<head>
    <title>Pi QR Langu</title>
    <script src="pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body { text-align: center; font-family: Arial; padding: 20px; background: #f5f5f5; }
        input { padding: 12px; width: 80%; margin: 10px; border: 2px solid #6c4ab6; border-radius: 5px; font-size: 16px; }
        button { padding: 12px 25px; background: #6c4ab6; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #563d9c; }
        #qrcode { margin-top: 20px; display: flex; justify-content: center; }
    </style>
</head>
<body>
    <h1>Pi QR Langu</h1>
    <p>Andika kiasi cha Pi halafu bonyeza Tengeneza</p>
    <input type="number" id="amount" placeholder="Mf: 5" step="0.01">
    <button onclick="generateQR()">Tengeneza QR</button>
    <div id="qrcode"></div>

    <script>
        Pi.init({ version: "2.0" });
        function generateQR() {
            var amount = document.getElementById("amount").value;
            if(amount == "") {
                alert("Tafadhali andika kiasi kwanza");
                return;
            }
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), "pi://pay?amount=" + amount + "&memo=Malipo ya Pi");
        }
    </script>
</body>
</html>
