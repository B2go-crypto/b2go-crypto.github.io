<!DOCTYPE html>
<html>
<head>
    <title>Duka Langu</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="text-align:center; font-family:sans-serif; padding-top:50px;">
    <h1 style="color:purple;">Karibu Duka Langu</h1>
    <p>Bidhaa: 1 Pi</p>
    <button id="payButton" style="background:purple; color:white; padding:15px 30px; border:none; border-radius:10px; font-size:18px;">LIPA KWA PI</button>

    <script>
        Pi.init({ version: "2.0" });
        
        document.getElementById("payButton").onclick = function() {
            const paymentData = {
                amount: 1,
                memo: "Ununuzi wa bidhaa",
                metadata: { bidhaa: "1" }
            };
            
            Pi.createPayment(paymentData, {
                onReadyForServerApproval: function(paymentId) {
                    alert("Malipo yameanza. ID: " + paymentId);
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    alert("Hongera! Malipo yamekamilika");
                },
                onCancel: function(paymentId) {
                    alert("Umeghairi malipo");
                },
                onError: function(error) {
                    alert("Kuna shida: " + error);
                }
            });
        };
    </script>
</body>
</html>
