<!DOCTYPE html>
<html>
<head>
    <title>Pi QR Langu</title>
    <script src="pi-sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        body { text-align: center; font-family: Arial; background: #f5f5f5; padding: 20px; }
        input { padding: 12px; width: 80%; margin: 10px; border: 2px solid #6f2dbd; border-radius: 5px; }
        button { padding: 12px 25px; background: #6f2dbd; color: white; border: none; border-radius: 5px; font-size: 16px; }
        #qrcode { margin-top: 20px; display: flex; justify-content: center; }
    </style>
</head>
<body>
    <h2>Pi QR Langu</h2>
    <p>Andika kiasi cha Pi</p>
    <input type="number" id="amount" placeholder="MF: 2.5">
    <button onclick="makeQR()">Tengeneza QR</button>
    <div id="qrcode"></div>

    <script>
        Pi.init({ version: "2.0" });
        
        function makeQR() {
            var amount = document.getElementById("amount").value;
            if(amount == ""){ alert("Andika kiasi kwanza"); return; }
            
            // HII NDIO ANWANI YAKO HALISI YA WALLET
            var piAddress = "GDGTQ...DU3PS";
            
            var piLink = "pi://pay?amount=" + amount + "&to=" + piAddress + "&memo=Malipo";
            
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), piLink);
        }
    </script>
</body>
</html>
