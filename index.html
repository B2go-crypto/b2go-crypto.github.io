<!DOCTYPE html>
<html>
<head>
  <title>Duka Langu Pi</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>Pi.init({ version: "2.0", sandbox: true })</script>
</head>
<body style="text-align:center; padding:50px">
  <h1>Karibu Duka Langu Pi</h1>
  <p>Bidhaa: Simu</p>
  <p>Bei: 1 Pi</p>
  <button onclick="lipa()">LIPA KWA PI</button>

  <script>
    function lipa() {
      Pi.authenticate(["payments"]).then(() => {
        Pi.createPayment({amount: 1, memo: "Test", metadata: {}}, {
          onReadyForServerApproval: (id) => Pi.approvePayment(id),
          onReadyForServerCompletion: (id, tx) => Pi.completePayment(id, tx),
          onCancel: () => {},
          onError: (e) => alert(e)
        });
      });
    }
  </script>
</body>
</html>
