<script>
        Pi.init({ version: "2.0", sandbox: "true" }); // ONGEZA sandbox:true
        
        Pi.authenticate(['username', 'payments'], function(auth) {
            console.log("User authenticated");
        }, function(error) {
            console.error(error);
        });

        document.getElementById("payButton").onclick = function() {
            const paymentData = {
                amount: 1,
                memo: "Ununuzi wa bidhaa",
                metadata: { bidhaa: "1" }
            };
            
            Pi.createPayment(paymentData, {
                onReadyForServerApproval: function(paymentId) {
                    alert("Malipo yameanza. ID: " + paymentId);
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    alert("Hongera! Malipo yamekamilika");
                },
                onCancel: function(paymentId) {
                    alert("Umeghairi malipo");
                },
                onError: function(error) {
                    alert("Kuna shida: " + error);
                }
            });
        };
    </script>
