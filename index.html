<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duka Langu Pi</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body { font-family: Arial; text-align: center; padding: 50px; background: #f5f5f5; }
    h1 { color: #4B0082; }
    button { background: #4B0082; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; }
    button:active { background: #6A0DAD; }
  </style>
</head>
<body>
  <h1>Karibu Duka Langu</h1>
  <p><b>Bidhaa: 1 Pi</b></p>
  <button id="payBtn">LIPA KWA PI</button>

  <script>
    Pi.init({ version: "2.0", sandbox: true });
    
    document.getElementById("payBtn").onclick = function() {
      Pi.createPayment({
        amount: 1, 
        memo: "Bidhaa kutoka Duka Langu", 
        metadata: {productId: "1"}
      }, {
        onReadyForServerApproval: function(paymentId) { 
          alert("Inaidhinishwa... Tafadhali subiri"); 
        },
        onReadyForServerCompletion: function(paymentId, txid) { 
          alert("Asante! Malipo yamefanikiwa ✅"); 
        },
        onCancel: function(paymentId) { 
          alert("Umeaghairi malipo"); 
        },
        onError: function(error) { 
          alert("Kosa limetokea: " + error); 
        }
      });
    };
  </script>
</body>
</html>
