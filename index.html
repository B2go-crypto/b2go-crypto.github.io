<!DOCTYPE html>
<html>
<head>
  <title>Duka Langu Pi</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>Pi.init({ version: "2.0", sandbox: true })</script>
</head>
<body style="text-align:center; font-family:sans-serif; padding:50px">
  <h1>Karibu Duka Langu Pi</h1>
  <p>Bidhaa: Simu</p>
  <p>Bei: 1 Pi</p>
  <button style="background:orange; color:white; padding:15px; border:none; font-size:18px; border-radius:10px" onclick="lipa()">LIPA KWA PI</button>

  <script>
    async function lipa() {
      const scopes = ["payments"];
      const auth = await Pi.authenticate(scopes);
      
      const paymentData = {
        amount: 1,
        memo: "Majaribio ya Duka",
        metadata: { bidhaa: "Simu" }
      };

      const callbacks = {
        onReadyForServerApproval: (paymentId) => {
          console.log("Approving:", paymentId);
          Pi.approvePayment(paymentId);
        },
        onReadyForServerCompletion: (paymentId, txid) => {
          console.log("Completing:", paymentId);
          Pi.completePayment(paymentId, txid);
          alert("✅ Asante! Malipo yamekamilika");
        },
        onCancel: (paymentId) => { alert("Umebatilisha malipo"); },
        onError: (error) => { alert("Kosa: " + error); }
      };

      Pi.createPayment(paymentData, callbacks);
    }
  </script>
</body>
</html>
