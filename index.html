<!DOCTYPE html>
<html>
<head>
  <title>Duka Langu Pi</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>Pi.init({ version: "2.0", sandbox: true })</script>
</head>
<body style="text-align:center; font-family:sans-serif; padding:50px">
  <h1>Karibu Duka Langu Pi</h1>
  <p>Bidhaa: Simu</p>
  <p>Bei: 1 Pi</p>
  <button style="background:orange; color:white; padding:15px; border:none; font-size:18px; border-radius:10px" onclick="lipa()">LIPA KWA PI</button>

  <script>
    function lipa() {
      const callbacks = {
        onReadyForServerApproval: function(paymentId) {  },
        onReadyForServerCompletion: function(paymentId, txid) { alert("Asante! Malipo yamekamilika"); },
        onCancel: function(paymentId) { alert("Umebatilisha malipo"); },
        onError: function(error) { alert("Kosa: " + error); }
      };
      
      Pi.authenticate(["payments"]).then(function(auth) {
        Pi.createPayment({
          amount: 1,
          memo: "Majaribio ya Duka",
          metadata: { bidhaa: "Simu" }
        }, callbacks);
      }).catch(function(error) {
        alert("Login error: " + error);
      });
    }
  </script>
</body>
</html>
