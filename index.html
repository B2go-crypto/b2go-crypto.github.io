<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B2Go Zakat & Charity</title><script src="https://sdk.minepi.com/pi-sdk.js"></script><style>body{font-family:system-ui;padding:20px;text-align:center;background:#f8fafc} .card{max-width:480px;margin:auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001} h1{color:#059669} .lang{margin:10px 0} .lang button{margin:4px;padding:6px 12px;border-radius:8px;border:1px solid #ddd} .lang .active{background:#059669;color:#fff} input{width:90%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc} .btn{width:95%;padding:14px;background:#FFA500;color:#000;font-weight:bold;border:0;border-radius:10px;font-size:18px;margin-top:12px}</style></head><body><div class="card"><div class="lang"><button onclick="setLang('sw')" id="b-sw" class="active">Swahili</button><button onclick="setLang('en')" id="b-en">English</button><button onclick="setLang('ar')" id="b-ar">العربية</button></div><h1 id="title">B2Go Zakat</h1><p id="desc">Toa Zakat yako kwa urahisi kwa Pi</p><label id="l-amount">Kiasi (Pi):</label><input id="amount" type="number" value="1" min="0.1" step="0.1"><label id="l-type">Aina:</label><input id="type" value="Zakat Al-Mal"><button class="btn" id="btn-pay" onclick="lipa()">Lipa kwa Pi</button><p id="status" style="margin-top:15px;color:#059669"></p><p style="font-size:12px;color:#666;margin-top:20px">Inaendeshwa na B2Go-crypto • Halal & Amanah</p></div><script>const T={sw:{title:"B2Go Zakat & Sadaka",desc:"Toa Zakat yako kwa urahisi kwa Pi",amount:"Kiasi (Pi):",type:"Aina:",btn:"Lipa kwa Pi"},en:{title:"B2Go Zakat & Charity",desc:"Give your Zakat easily with Pi",amount:"Amount (Pi):",type:"Type:",btn:"Pay with Pi"},ar:{title:"B2Go الزكاة والصدقة",desc:"أعط زكاتك بسهولة بـ Pi",amount:"المبلغ (Pi):",type:"النوع:",btn:"ادفع بـ Pi"}};function setLang(l){localStorage.lang=l;document.querySelectorAll('.lang button').forEach(b=>b.classList.remove('active'));document.getElementById('b-'+l).classList.add('active');const t=T[l];document.getElementById('title').innerText=t.title;document.getElementById('desc').innerText=t.desc;document.getElementById('l-amount').innerText=t.amount;document.getElementById('l-type').innerText=t.type;document.getElementById('btn-pay').innerText=t.btn}setLang(localStorage.lang||'sw');Pi.init({version:"2.0",sandbox:true});function lipa(){const amt=parseFloat(document.getElementById('amount').value);const tp=document.getElementById('type').value;if(!amt||amt<=0){alert("Weka kiasi");return}document.getElementById('status').innerText="Inaunganisha...";Pi.authenticate(["payments"]).then(a=>{Pi.createPayment({amount:amt,memo:"Zakat - "+tp,metadata:{type:tp}}, {onReadyForServerApproval:id=>{document.getElementById('status').innerText="Inathibitisha...";fetch("/api/approve",{method:"POST",body:JSON.stringify({paymentId:id})})},onReadyForServerCompletion:(id,tx)=>{document.getElementById('status').innerText="Imekamilika! Shukran! Tx: "+tx;fetch("/api/complete",{method:"POST",body:JSON.stringify({paymentId:id,txid:tx})})},onCancel:()=>{document.getElementById('status').innerText="Imeghairiwa"},onError:e=>{document.getElementById('status').innerText="Hitilafu: "+e}})})};</script></body></html>
