<script>
  const Pi = window.Pi;
  
  Pi.init({ version: "2.0" });

  document.getElementById("payBtn").onclick = async function() {
    const paymentData = {
      amount: 1,
      memo: "Bidhaa kutoka Duka Langu",
      metadata: { productId: "1" }
    };

    const callbacks = {
      onReadyForServerApproval: function(paymentId) {
        console.log("Idhini: " + paymentId);
        // Hapa tutaidhinisha baadaye
      },
      onReadyForServerCompletion: function(paymentId, txid) {
        console.log("Imemaliza: " + paymentId + " Txid: " + txid);
        alert("Asante! Malipo yamefanikiwa");
      },
      onCancel: function(paymentId) { alert("Umeaghairi malipo"); },
      onError: function(error) { alert("Kosa: " + error); }
    };

    Pi.createPayment(paymentData, callbacks);
  };
</script>
